<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Formula</title>
<meta name="description" content="Apex Formula – 3D-Formel-Rennsimulation im Browser mit Lenkradunterstützung (Phase 1)">
<style>
/* ==========================================================================
   APEX FORMULA – Oberfläche (dunkle Flächen, kräftige Akzentfarbe, Kursiv)
   ========================================================================== */
:root {
  --bg0: #07080b; --bg1: #0e1117; --bg2: #151a22; --bg3: #1d2430; --line: #2a3342;
  --tx0: #f4f6fa; --tx1: #b9c2cf; --tx2: #7d8898;
  --acc: #ff3b1f; --acc2: #ffd400; --ok: #2fe36b; --warn: #ffb02e; --bad: #ff3b3b; --info: #38c6ff; --purple: #b65cff;
  --font: "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif;
  --mono: "Cascadia Mono", "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg0); color: var(--tx0); font-family: var(--font); overflow: hidden; user-select: none; -webkit-user-select: none; }
canvas#gl { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; outline: none; }
.hidden { display: none !important; }
button, input, select, textarea { font-family: var(--font); }
h1, h2, h3, .ital { font-style: italic; text-transform: uppercase; letter-spacing: 0.02em; }

/* ---------- Ladebildschirm / Fehler ---------- */
#boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, #1a1f2a 0%, #07080b 70%); }
#boot .logo { font-size: 64px; font-weight: 900; font-style: italic; letter-spacing: -1px; }
#boot .logo b { color: var(--acc); }
#boot .sub { color: var(--tx1); font-style: italic; text-transform: uppercase; letter-spacing: 0.3em; margin-top: 4px; }
#boot .bar { width: 320px; height: 4px; background: var(--bg3); margin-top: 34px; overflow: hidden; transform: skewX(-20deg); }
#boot .bar i { display: block; height: 100%; width: 30%; background: var(--acc); animation: load 1.1s ease-in-out infinite; }
@keyframes load { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
#boot .msg { margin-top: 16px; color: var(--tx2); font-size: 14px; min-height: 20px; }
#boot .err { margin-top: 18px; max-width: 720px; color: #ffd0c8; background: #2a0f0c; border-left: 4px solid var(--acc); padding: 14px 18px; font-size: 14px; white-space: pre-wrap; display: none; user-select: text; }

/* ---------- Bildschirme ---------- */
.screen { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; padding: 34px 48px; background: linear-gradient(90deg, rgba(7,8,11,0.94) 0%, rgba(7,8,11,0.78) 45%, rgba(7,8,11,0.2) 100%); overflow: auto; }
.screen.solid { background: rgba(7,8,11,0.93); }
.screen header { display: flex; align-items: baseline; gap: 18px; margin-bottom: 18px; }
.screen header h1 { margin: 0; font-size: 34px; font-weight: 900; }
.screen header .crumb { color: var(--acc); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 14px; letter-spacing: 0.15em; }
.brand { font-size: 74px; font-weight: 900; font-style: italic; line-height: 0.9; letter-spacing: -2px; margin: 18px 0 2px; }
.brand b { color: var(--acc); }
.brand-sub { font-style: italic; text-transform: uppercase; letter-spacing: 0.32em; color: var(--tx1); font-size: 15px; margin-bottom: 44px; }
.menu { display: flex; flex-direction: column; gap: 10px; width: 420px; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 22px; background: var(--bg2); color: var(--tx0); border: 0; border-left: 4px solid transparent; font-size: 17px; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; transform: skewX(-10deg); transition: background 0.12s, border-color 0.12s, transform 0.12s; text-align: left; }
.btn > * { transform: skewX(10deg); }
.btn:hover, .btn:focus-visible { background: var(--bg3); border-left-color: var(--acc); outline: none; transform: skewX(-10deg) translateX(4px); }
.btn.primary { background: var(--acc); color: #fff; }
.btn.primary:hover { background: #ff5a3f; }
.btn.small { padding: 8px 14px; font-size: 13px; }
.btn.ghost { background: transparent; border: 1px solid var(--line); border-left: 4px solid var(--line); }
.btn .k { color: var(--tx2); font-size: 12px; font-weight: 600; }
.btn:disabled { opacity: 0.4; cursor: default; }
.menu .btn { font-size: 19px; padding: 16px 24px; }
.foot { position: fixed; bottom: 16px; left: 48px; color: var(--tx2); font-size: 12px; font-style: italic; }
.foot span { color: var(--tx1); }
.devices-pill { position: fixed; bottom: 16px; right: 24px; color: var(--tx1); font-size: 12px; background: rgba(14,17,23,0.8); padding: 8px 12px; border-left: 3px solid var(--info); max-width: 46vw; }

/* ---------- Karten, Formulare ---------- */
.row { display: flex; gap: 18px; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 12px; }
.card { background: rgba(21,26,34,0.92); border: 1px solid var(--line); padding: 18px 20px; }
.card h3 { margin: 0 0 12px; font-size: 15px; color: var(--acc); letter-spacing: 0.08em; }
.card p { color: var(--tx1); font-size: 14px; line-height: 1.5; margin: 6px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; background: var(--bg2); border: 1px solid var(--line); color: var(--tx1); cursor: pointer; font-weight: 700; font-style: italic; text-transform: uppercase; font-size: 13px; transform: skewX(-10deg); }
.chip > * { display: inline-block; transform: skewX(10deg); }
.chip.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.chip .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,0.5); }
.field { display: grid; grid-template-columns: 220px 1fr 70px; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid rgba(42,51,66,0.5); font-size: 14px; }
.field label { color: var(--tx1); }
.field .val { color: var(--tx0); font-family: var(--mono); font-size: 13px; text-align: right; }
.field.wide { grid-template-columns: 220px 1fr; }
input[type=range] { width: 100%; accent-color: var(--acc); }
input[type=number], input[type=text], select, textarea { background: var(--bg1); color: var(--tx0); border: 1px solid var(--line); padding: 7px 9px; font-size: 14px; }
textarea { width: 100%; min-height: 160px; font-family: var(--mono); font-size: 12px; user-select: text; }
select { min-width: 180px; }
.toggle { display: inline-flex; flex-wrap: wrap; gap: 0; }
.toggle button { background: var(--bg1); color: var(--tx1); border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; font-weight: 700; font-size: 12px; text-transform: uppercase; font-style: italic; }
.toggle button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.tabs button { background: var(--bg2); color: var(--tx1); border: 0; border-bottom: 3px solid transparent; padding: 10px 16px; font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 13px; cursor: pointer; }
.tabs button.on { color: #fff; border-bottom-color: var(--acc); background: var(--bg3); }
.hint { color: var(--tx2); font-size: 13px; line-height: 1.5; border-left: 3px solid var(--acc2); padding: 6px 12px; background: rgba(255,212,0,0.05); margin: 8px 0; }
.hint b { color: var(--tx0); }
.kbd { display: inline-block; min-width: 22px; padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--bg1); font-size: 12px; font-family: var(--mono); text-align: center; margin: 1px; }
table.bind { border-collapse: collapse; width: 100%; font-size: 14px; }
table.bind td { padding: 6px 8px; border-bottom: 1px solid rgba(42,51,66,0.6); }
table.bind td:first-child { color: var(--tx1); width: 40%; }
.bar { position: relative; height: 12px; background: var(--bg1); border: 1px solid var(--line); overflow: hidden; }
.bar > i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--acc); }
.bar.center > i { left: 50%; }
.bar > em { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
.scroll { overflow: auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
.track-card { display: grid; grid-template-columns: 240px 1fr; gap: 18px; }
.track-card canvas { background: var(--bg1); border: 1px solid var(--line); }
.stat { display: inline-block; margin-right: 22px; }
.stat b { display: block; font-size: 22px; font-style: italic; }
.stat small { color: var(--tx2); text-transform: uppercase; font-size: 11px; letter-spacing: 0.1em; }
.actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

/* ---------- Eingabetest ---------- */
.dev { background: rgba(21,26,34,0.95); border: 1px solid var(--line); padding: 14px 16px; }
.dev h4 { margin: 0 0 4px; font-style: italic; font-size: 15px; }
.dev .id { font-family: var(--mono); font-size: 11px; color: var(--tx2); word-break: break-all; margin-bottom: 8px; user-select: text; }
.axis { display: grid; grid-template-columns: 58px 1fr 64px 64px; gap: 8px; align-items: center; font-family: var(--mono); font-size: 12px; margin: 3px 0; }
.axis .bar { height: 10px; }
.btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.btns span { width: 30px; height: 22px; display: inline-flex; align-items: center; justify-content: center; background: var(--bg1); border: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--tx2); }
.btns span.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.tag { display: inline-block; font-size: 11px; padding: 2px 7px; margin-left: 6px; background: var(--bg3); color: var(--tx1); font-style: normal; text-transform: uppercase; letter-spacing: 0.05em; }
.tag.ok { background: rgba(47,227,107,0.15); color: var(--ok); }
.tag.warn { background: rgba(255,176,46,0.15); color: var(--warn); }

/* ---------- Modale Dialoge ---------- */
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(4,5,8,0.78); display: flex; align-items: center; justify-content: center; }
.modal .box { width: min(860px, 94vw); max-height: 92vh; overflow: auto; background: var(--bg1); border: 1px solid var(--line); border-top: 4px solid var(--acc); padding: 24px 28px; }
.modal h2 { margin: 0 0 6px; font-size: 24px; }
.wiz-steps { display: flex; gap: 3px; margin: 10px 0 18px; }
.wiz-steps i { flex: 1; height: 4px; background: var(--bg3); }
.wiz-steps i.done { background: var(--ok); }
.wiz-steps i.cur { background: var(--acc); }
.wiz-body { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; }
.wiz-text { font-size: 17px; line-height: 1.5; }
.wiz-cand { margin-top: 12px; font-family: var(--mono); font-size: 13px; color: var(--tx1); min-height: 40px; }
.curve-ed { background: var(--bg0); border: 1px solid var(--line); cursor: crosshair; touch-action: none; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; font-style: italic; }
.hud-panel { position: absolute; background: linear-gradient(180deg, rgba(10,12,16,0.82), rgba(10,12,16,0.68)); border-left: 3px solid var(--acc); padding: 8px 12px; }
#hudLap { top: 18px; left: 18px; min-width: 230px; }
#hudLap .ttl { font-size: 12px; font-weight: 900; letter-spacing: 0.18em; color: var(--acc); text-transform: uppercase; }
#hudLap .big { font-size: 30px; font-weight: 900; font-family: var(--font); font-variant-numeric: tabular-nums; }
#hudLap .ln { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--tx1); font-variant-numeric: tabular-nums; font-weight: 700; }
#hudLap .ln b { color: var(--tx0); }
#hudDelta { font-size: 18px; font-weight: 900; }
#hudMap { position: absolute; top: 14px; right: 14px; width: 220px; height: 220px; background: rgba(10,12,16,0.55); border-radius: 6px; }
#hudCenter { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: 560px; }
.rpm { display: flex; gap: 3px; height: 14px; margin-bottom: 6px; transform: skewX(-20deg); }
.rpm i { flex: 1; background: rgba(255,255,255,0.08); }
.rpm i.g { background: var(--ok); } .rpm i.r { background: var(--bad); } .rpm i.b { background: #3a7bff; } .rpm i.w { background: #e8edf5; }
.rpm.flash i { animation: fl 0.12s steps(2) infinite; }
@keyframes fl { 50% { opacity: 0.15; } }
.dash { display: grid; grid-template-columns: 1fr 110px 1fr; align-items: center; background: linear-gradient(180deg, rgba(10,12,16,0.86), rgba(10,12,16,0.7)); border-bottom: 3px solid var(--acc); padding: 6px 14px; }
.dash .gear { font-size: 64px; font-weight: 900; text-align: center; line-height: 1; }
.dash .spd { font-size: 40px; font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
.dash .spd small { font-size: 12px; color: var(--tx2); margin-left: 4px; }
.dash .lft { font-size: 13px; color: var(--tx1); line-height: 1.6; font-weight: 700; }
.ind { display: inline-block; padding: 1px 7px; margin-right: 4px; font-size: 11px; font-weight: 900; background: rgba(255,255,255,0.08); color: var(--tx2); font-style: normal; }
.ind.on { background: var(--acc2); color: #000; }
.ind.blue { background: #2f7dff; color: #fff; }
.ind.pink { background: #ff3bd4; color: #fff; }
.ind.green { background: var(--ok); color: #000; }
#hudErs { position: absolute; right: 18px; bottom: 20px; width: 250px; }
#hudErs .lbl { display: flex; justify-content: space-between; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--tx1); }
.soc { height: 16px; background: rgba(255,255,255,0.06); margin: 5px 0 8px; transform: skewX(-20deg); position: relative; overflow: hidden; }
.soc > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #1f6bff, #38c6ff); }
.soc.harv > i { background: linear-gradient(90deg, #12b39a, #2fe3c6); }
.soc.boost > i { background: linear-gradient(90deg, #c42aa8, #ff3bd4); }
#hudTyres { position: absolute; left: 18px; bottom: 20px; width: 200px; }
.tyres { position: relative; width: 120px; height: 150px; margin: 4px auto 6px; }
.tyres .car { position: absolute; left: 48px; top: 12px; width: 24px; height: 126px; background: rgba(255,255,255,0.12); clip-path: polygon(30% 0, 70% 0, 80% 20%, 100% 55%, 85% 100%, 15% 100%, 0 55%, 20% 20%); }
.tyres .t { position: absolute; width: 30px; height: 46px; border: 2px solid rgba(0,0,0,0.6); font-size: 11px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #000; font-style: normal; line-height: 1.1; }
.tyres .t small { font-size: 9px; font-weight: 700; }
.t0 { left: 4px; top: 10px; } .t1 { right: 4px; top: 10px; } .t2 { left: 0; bottom: 4px; width: 34px !important; } .t3 { right: 0; bottom: 4px; width: 34px !important; }
.slip { display: flex; gap: 6px; justify-content: center; font-size: 11px; font-weight: 900; }
.slip span { padding: 1px 8px; background: rgba(255,255,255,0.08); color: var(--tx2); font-style: normal; }
.slip span.y { background: var(--warn); color: #000; } .slip span.r { background: var(--bad); color: #fff; }
#hudMsg { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
#hudMsg div { background: rgba(10,12,16,0.85); border-left: 4px solid var(--acc2); padding: 8px 18px; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; animation: msgIn 0.18s ease-out; }
@keyframes msgIn { from { transform: translateY(-8px); opacity: 0; } }
#hudMfd { position: absolute; right: 18px; top: 250px; width: 250px; }
#hudMfd h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.16em; color: var(--acc); }
#hudMfd .ln { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-style: normal; }
#inputOverlay { position: absolute; left: 18px; bottom: 236px; width: 320px; }
#inputOverlay .bar { height: 10px; margin: 4px 0; }
#inputOverlay .bar.thr > i { background: var(--ok); } #inputOverlay .bar.brk > i { background: var(--bad); } #inputOverlay .bar.clu > i { background: var(--info); }
#ffbCanvas { width: 296px; height: 70px; display: block; margin-top: 4px; background: rgba(0,0,0,0.35); }
#fpsBox { position: absolute; top: 244px; right: 14px; font-family: var(--mono); font-size: 12px; font-style: normal; background: rgba(0,0,0,0.6); padding: 4px 8px; text-align: right; }
#fpsGraph { display: block; margin-top: 4px; }
#toasts { position: fixed; z-index: 80; bottom: 26px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
#toasts div { background: rgba(14,17,23,0.95); border-left: 4px solid var(--info); padding: 10px 18px; font-size: 14px; max-width: 70vw; animation: msgIn 0.2s ease-out; }
@media (max-width: 1100px) { #hudCenter { width: 440px; } .screen { padding: 22px 24px; } .brand { font-size: 52px; } .wiz-body { grid-template-columns: 1fr; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<body>
<canvas id="gl" tabindex="0"></canvas>

<div id="boot">
  <div class="logo">APEX <b>FORMULA</b></div>
  <div class="sub">World Championship</div>
  <div class="bar"><i></i></div>
  <div class="msg" id="bootMsg">Lade 3D-Engine …</div>
  <div class="err" id="bootErr"></div>
</div>

<div id="hud" class="hidden">
  <div id="hudLap" class="hud-panel">
    <div class="ttl" id="hudMode">Testfahrt</div>
    <div class="ln"><span>Runde <b id="hudLapNo">1</b></span><span id="hudDelta"></span></div>
    <div class="big" id="hudTime">0:00.000</div>
    <div class="ln"><span>Letzte</span><b id="hudLast">-:--.---</b></div>
    <div class="ln"><span>Beste</span><b id="hudBest">-:--.---</b></div>
  </div>
  <canvas id="hudMap" width="220" height="220"></canvas>
  <div id="fpsBox" class="hidden"><span id="fpsTxt"></span><canvas id="fpsGraph" width="160" height="40" class="hidden"></canvas></div>
  <div id="hudCenter">
    <div class="rpm" id="hudRpm"></div>
    <div class="dash">
      <div class="lft"><div><span class="ind" id="indTC">TC</span><span class="ind" id="indABS">ABS</span><span class="ind" id="indLim">LIMIT</span></div><div>BB <b id="hudBB">56,0</b> % · <span id="hudComp">M</span></div></div>
      <div class="gear" id="hudGear">N</div>
      <div class="spd"><span id="hudSpeed">0</span><small>km/h</small></div>
    </div>
  </div>
  <div id="hudErs" class="hud-panel">
    <div class="lbl"><span>Energie</span><span id="hudSoc">80 %</span></div>
    <div class="soc" id="hudSocBar"><i></i></div>
    <div class="lbl"><span id="hudErsMode">Ausgeglichen</span><span><span class="ind" id="indOT">ÜBERHOL</span><span class="ind" id="indAero">KURVE</span></span></div>
  </div>
  <div id="hudTyres" class="hud-panel">
    <div class="lbl ital" style="font-size:12px;font-weight:900;letter-spacing:.1em;color:#b9c2cf">Reifen <span id="hudTyreName"></span></div>
    <div class="tyres"><div class="car"></div><div class="t t0" id="ty0"></div><div class="t t1" id="ty1"></div><div class="t t2" id="ty2"></div><div class="t t3" id="ty3"></div></div>
    <div class="slip"><span id="slipF">Schlupf V</span><span id="slipR">Schlupf H</span></div>
  </div>
  <div id="hudMfd" class="hud-panel hidden"></div>
  <div id="inputOverlay" class="hud-panel hidden">
    <div class="lbl ital" style="font-size:12px;font-weight:900;letter-spacing:.12em">Eingaben <span id="ioSrc" class="tag"></span></div>
    <div class="bar center" id="ioSteer"><i></i></div>
    <div class="bar thr" id="ioThr"><i></i></div>
    <div class="bar brk" id="ioBrk"><i></i></div>
    <div class="bar clu" id="ioClu"><i></i></div>
    <div style="font-size:11px;color:#7d8898;font-style:normal">FFB-Moment (berechnet, −1…1) <span id="ioFfb"></span></div>
    <canvas id="ffbCanvas" width="296" height="70"></canvas>
  </div>
  <div id="hudMsg"></div>
</div>

<div id="screens"></div>
<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
  // Fehleranzeige außerhalb des Moduls (fängt auch fehlgeschlagene CDN-Ladevorgänge ab)
  (function () {
    var shown = false;
    function showErr(msg) {
      var b = document.getElementById('boot'), e = document.getElementById('bootErr');
      if (!b || !e) return;
      b.classList.remove('hidden'); b.style.display = 'flex';
      e.style.display = 'block'; e.textContent = (shown ? e.textContent + '\n\n' : '') + msg; shown = true;
      var m = document.getElementById('bootMsg'); if (m) m.textContent = 'Fehler';
    }
    window.__apexShowError = showErr;
    window.addEventListener('error', function (ev) {
